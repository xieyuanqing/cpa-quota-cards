<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>额度与用量</title>
<style>
:root{
  --accent:var(--primary-color,#0a84ff);
  --ink:var(--text-primary,#111827);
  --ink2:var(--text-secondary,#4b5563);
  --ink3:var(--text-tertiary,#8e8e93);
  --surface:var(--app-surface,#ffffff);
  --page:var(--app-bg,#eef1f7);
  --hair:var(--border-color,rgba(60,60,67,.12));
  --good:#30d158;--warn:#ff9f0a;--bad:#ff453a;--idle:#8e8e93;
  --radius:24px;--radius-sm:16px;
  --glass:color-mix(in srgb,var(--surface) 66%,transparent);
  --glass-2:color-mix(in srgb,var(--surface) 44%,transparent);
  --stroke:color-mix(in srgb,var(--surface) 70%,transparent);
  --shadow:0 10px 34px rgba(15,23,42,.10),0 1px 0 rgba(255,255,255,.6) inset;
  --tint:color-mix(in srgb,var(--accent) 14%,transparent);
  color-scheme:light dark;
}
html.theme-dark,:root[data-theme='dark']{
  --shadow:0 12px 40px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.06) inset;
  --stroke:color-mix(in srgb,var(--surface) 60%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  color:var(--ink);background:var(--page);
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));
  position:relative;overflow-x:hidden;
}
body::before,body::after{content:'';position:fixed;z-index:0;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
body::before{width:60vw;height:60vw;max-width:520px;max-height:520px;top:-16vw;right:-14vw;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent) 82%,transparent),transparent 70%)}
body::after{width:66vw;height:66vw;max-width:560px;max-height:560px;bottom:-22vw;left:-18vw;background:radial-gradient(circle at 70% 70%,color-mix(in srgb,#ff375f 62%,transparent),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto}
.card{background:var(--glass);border:.5px solid var(--stroke);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
.hero{padding:4px 2px 14px}
.hero-top{display:flex;align-items:center;gap:14px}
.app-icon{width:56px;height:56px;flex:0 0 56px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 92%,#fff),color-mix(in srgb,var(--accent) 60%,#7c3aed));color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent),0 1px 0 rgba(255,255,255,.45) inset}
h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.6px}
.sub{margin:3px 0 0;font-size:13.5px;color:var(--ink3);font-weight:400}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;background:var(--tint);color:color-mix(in srgb,var(--accent) 78%,var(--ink));border:.5px solid color-mix(in srgb,var(--accent) 26%,transparent)}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.plain{background:color-mix(in srgb,var(--ink3) 16%,transparent);color:var(--ink2);border-color:transparent}
.pill.plain::before{display:none}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 82%,var(--ink));border-color:transparent}
.btn{-webkit-appearance:none;appearance:none;font:600 14.5px/1 inherit;color:var(--ink);cursor:pointer;padding:11px 17px;border-radius:14px;border:.5px solid var(--hair);background:color-mix(in srgb,var(--surface) 55%,transparent);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s ease,opacity .18s ease}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn:active{transform:scale(.96);opacity:.9}
.btn:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.manual{margin-top:14px;padding:15px;border-radius:var(--radius-sm);background:var(--glass-2);border:.5px solid var(--stroke)}
.manual p{margin:0 0 11px;font-size:13px;color:var(--ink3)}
.row{display:flex;gap:9px;flex-wrap:wrap}
input[type=password]{flex:1 1 220px;min-width:0;font:400 15px/1.3 inherit;color:var(--ink);padding:12px 14px;border-radius:14px;border:.5px solid var(--hair);background:color-mix(in srgb,var(--surface) 70%,transparent)}
input[type=password]::placeholder{color:var(--ink3)}
input[type=password]:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:transparent}
.hidden{display:none!important}
.note{margin-top:12px;font-size:13px;color:var(--ink3);min-height:0}
.note:empty{display:none}
.warn{color:var(--warn);font-weight:500}
.summary{margin:14px 2px 14px;font-size:14px;color:var(--ink2)}

.accounts{display:grid;gap:14px}
@media(min-width:700px){.accounts{grid-template-columns:1fr 1fr}}
.acct{display:flex;flex-direction:column;gap:13px;cursor:pointer;text-decoration:none;color:inherit;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease}
.acct:hover{transform:translateY(-2px)}
.acct:active{transform:scale(.985)}
.acct:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:3px}
.acct-head{display:flex;align-items:center;gap:12px}
.glyph{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;font:700 15px/1 inherit;color:#fff;letter-spacing:-.3px;background:linear-gradient(150deg,#ff9f0a,#ff375f);box-shadow:0 6px 16px rgba(255,55,95,.28)}
.acct[data-provider='codex'] .glyph,.dt-head[data-provider='codex'] .glyph{background:linear-gradient(150deg,#64d2ff,#0a84ff);box-shadow:0 6px 16px rgba(10,132,255,.28)}
.acct[data-provider='claude'] .glyph,.dt-head[data-provider='claude'] .glyph{background:linear-gradient(150deg,#ffb27a,#e07b39);box-shadow:0 6px 16px rgba(224,123,57,.28)}
.acct[data-provider='vertex'] .glyph,.dt-head[data-provider='vertex'] .glyph{background:linear-gradient(150deg,#5eead4,#0ea5e9);box-shadow:0 6px 16px rgba(14,165,233,.28)}
.acct-title{min-width:0;flex:1}
.acct h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.2px}
.acct-id{display:block;font:500 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tag{flex:0 0 auto;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--idle) 18%,transparent);color:var(--ink2)}
.tag[data-tone='good']{background:color-mix(in srgb,var(--good) 20%,transparent);color:color-mix(in srgb,var(--good) 82%,var(--ink))}
.tag[data-tone='info']{background:var(--tint);color:color-mix(in srgb,var(--accent) 80%,var(--ink))}
.tag[data-tone='warn']{background:color-mix(in srgb,var(--warn) 20%,transparent);color:color-mix(in srgb,var(--warn) 82%,var(--ink))}
.tag[data-tone='bad']{background:color-mix(in srgb,var(--bad) 20%,transparent);color:color-mix(in srgb,var(--bad) 80%,var(--ink))}

.win{display:grid;gap:7px}
.win-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.win-name{font-size:13.5px;font-weight:600;color:var(--ink2)}
.win-val{font-size:13.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.meter{height:9px;border-radius:999px;background:color-mix(in srgb,var(--ink3) 22%,transparent);overflow:hidden;position:relative}
.meter-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,#ff375f 55%,var(--accent)));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter-fill[data-tone='good']{background:linear-gradient(90deg,#30d158,color-mix(in srgb,#34c759 60%,#0a84ff))}
.meter-fill[data-tone='warn']{background:linear-gradient(90deg,#ffd60a,#ff9f0a)}
.meter-fill[data-tone='bad']{background:linear-gradient(90deg,#ff9f0a,#ff453a)}
.meter-cap{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.meter-cap b{color:var(--ink2);font-weight:600}
.rows{display:grid;gap:0;margin:0}
.rows>div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:.5px solid color-mix(in srgb,var(--hair) 70%,transparent)}
.rows>div:first-child{border-top:0}
.rows dt{margin:0;font-size:13.5px;color:var(--ink3)}
.rows dd{margin:0;font-size:13.5px;font-weight:550;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.rows dd.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500}
.sec-title{margin:22px 2px 10px;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.sec{margin-bottom:14px}
.sec h4{margin:0 0 4px;font-size:17px;font-weight:650;letter-spacing:-.2px}
.sec .sec-sub{margin:0 0 14px;font-size:12.5px;color:var(--ink3)}
.dt-head{display:flex;align-items:center;gap:14px}
.dt-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.4px}
.dt-head .acct-id{font-size:12.5px}
.src{font:500 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink3);word-break:break-all}
.models{display:grid;gap:0;margin:6px 0 0}
.models>div{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:8px 0;border-top:.5px solid color-mix(in srgb,var(--hair) 70%,transparent);font-size:13px}
.models>div:first-child{border-top:0}
.models .m-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.models .m-tok{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.models .m-cost{font-weight:600;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:6px}
.fc>div{padding:11px 13px;border-radius:14px;background:var(--glass-2);border:.5px solid var(--stroke)}
.fc .k{font-size:12px;color:var(--ink3);margin-bottom:3px}
.fc .v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.basis{margin-top:10px;font-size:12.5px;color:var(--ink3)}
.evidence{margin-top:8px;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
footer{margin:26px 2px 0;font-size:12.5px;color:var(--ink3);line-height:1.6}
footer code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.skeleton{height:132px;border-radius:var(--radius);background:var(--glass);border:.5px solid var(--stroke);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}
</style>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <div class="app-icon">📊</div>
      <div style="flex:1;min-width:0">
        <h1 id="title">额度与用量</h1>
        <p class="sub" id="subsub">按请求 token × 官方价格折算 · 额度百分比直接取自上游</p>
      </div>
    </div>
    <div class="toolbar">
      <span class="pill" id="stamp">读取中…</span>
      <span class="pill plain" id="srcpill">数据源:CPAMP 用量库 + 上游额度</span>
      <button class="btn" id="refresh">刷新</button>
      <button class="btn hidden" id="back">← 返回列表</button>
      <button class="btn hidden" id="manualToggle">连接…</button>
      <button class="btn hidden" id="reconnect">重新读取登录态</button>
    </div>
    <div class="manual hidden" id="manual">
      <p>未读到 CPAMP 面板登录态。粘贴面板管理员密钥(仅存本机浏览器):</p>
      <div class="row">
        <input type="password" id="key" placeholder="CPAMP 管理密钥" autocomplete="off">
        <button class="btn primary" id="connect">连接</button>
      </div>
    </div>
    <div class="note" id="note"></div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="accounts" id="accounts"><div class="skeleton"></div><div class="skeleton"></div></div>
  <div id="detail"></div>

  <footer>
    消耗 = 每次请求的 未缓存输入 / 缓存读 / 缓存写 / 输出 token × 官方单价(models.dev 价格表)。<br>
    额度 = 上游直接给的百分比:Claude 走 OAuth 用量接口实时拉取,Codex 随每个请求的响应头上报。<br>
    「预计整窗」由本窗口已花金额与已用百分点折算;有足够历史采样时改用容量反推(过原点回归),样本越多越准。
  </footer>
</div>
<script data-cfasync="false">
const API='/usage/api';
const $=id=>document.getElementById(id);
const money=v=>(v===null||v===undefined||isNaN(v))?'—':'$'+(Math.abs(v)<1?Number(v).toFixed(4):Number(v).toFixed(2));
const money2=v=>(v===null||v===undefined||isNaN(v))?'—':'$'+Number(v).toFixed(2);
const pct=v=>(v===null||v===undefined||isNaN(v))?'—':(Math.round(v*10)/10)+'%';
const num=n=>n===null||n===undefined?'—':Number(n).toLocaleString('en-US');
const tok=n=>{n=Number(n)||0;if(n>=1e9)return (n/1e9).toFixed(2)+'B';if(n>=1e6)return (n/1e6).toFixed(2)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return String(n)};
const clamp=v=>Math.max(0,Math.min(100,Number(v)||0));
const stamp=ms=>ms?new Date(ms).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'—';
const short=ms=>ms?new Date(ms).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'—';
const esc=s=>String(s===null||s===undefined?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tone=u=>u>=99.5?'bad':u>=89?'warn':u>=70?'info':'good';
function ago(ms){const d=Date.now()-ms;if(!ms)return '';if(d<60000)return '刚刚';if(d<3600000)return Math.floor(d/60000)+' 分钟前';if(d<86400000)return Math.floor(d/3600000)+' 小时前';return Math.floor(d/86400000)+' 天前'}

/* 复用 CPAMP 面板登录态(同源,存储是异或混淆的;v2 只用 host,v1 还掺 UA) */
function decodePanelStorage(raw){
  if(!raw)return null;
  if(raw.indexOf('enc::')!==0)return raw;
  try{
    const bin=atob(raw.slice(9));
    const enc=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const seed=raw.indexOf('enc::v2::')===0
      ? 'cli-proxy-api-webui::secure-storage|v2|'+location.host
      : 'cli-proxy-api-webui::secure-storage|'+location.host+'|'+navigator.userAgent;
    const keyBytes=new TextEncoder().encode(seed);
    const out=new Uint8Array(enc.length);
    enc.forEach((v,i)=>{out[i]=v^keyBytes[i%keyBytes.length]});
    return new TextDecoder().decode(out);
  }catch(e){return null}
}
function parsePanel(raw){if(!raw)return null;try{return JSON.parse(decodePanelStorage(raw))}catch(e){return null}}
function panelKey(){
  try{
    const persisted=parsePanel(localStorage.getItem('cli-proxy-auth'));
    const auth=persisted&&persisted.state||persisted;
    if(auth&&auth.managementKey&&auth.rememberPassword!==false){
      if(auth.apiBase&&new URL(auth.apiBase,location.origin).origin!==location.origin)return '';
      return String(auth.managementKey).trim();
    }
    const legacy=parsePanel(localStorage.getItem('managementKey'));
    if(legacy&&legacy.managementKey)return String(legacy.managementKey).trim();
  }catch(e){}
  return '';
}

let KEY='',TIMER=null,DATA=null,current=null;
const setNote=(t,cls)=>{const n=$('note');n.className='note '+(cls||'');n.innerHTML=t||''};

async function api(path){
  const r=await fetch(API+path,{headers:{Authorization:'Bearer '+KEY},cache:'no-store'});
  if(r.status===401)throw new Error('AUTH');
  if(!r.ok){let m='HTTP '+r.status;try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
  return r.json();
}

function windowHtml(w,compact){
  const u=clamp(w.used_percent),t=tone(u),us=w.usage||{};
  const cap=`<div class="meter-cap"><span>已用 <b>${pct(w.used_percent)}</b> · 剩 ${pct(w.remaining_percent)}</span><span>${w.reset_at_ms?('重置 '+short(w.reset_at_ms)):'—'}</span></div>`;
  const spend=`<div class="meter-cap"><span>本窗口 <b>${money2(us.cost)}</b> · ${num(us.calls)} 请求 · ${tok(us.total)} tok</span><span>预计整窗 <b>${money2(w.est_total_cost)}</b></span></div>`;
  const left=w.left_str?`　　还有 ${w.left_str}`:'';
  return `<div class="win">
    <div class="win-top"><span class="win-name">${esc(w.label)}窗口</span><span class="win-val">${u>=99.5?'已打满':pct(w.used_percent)+' 已用'}${left}</span></div>
    <div class="meter"><div class="meter-fill" data-tone="${t}" style="width:${u}%"></div></div>
    ${compact?spend:cap+spend}
  </div>`;
}

function cardHtml(a){
  const tag=cardTag(a);
  const wins=(a.windows||[]).map(w=>windowHtml(w,true)).join('');
  const metered=a.spend?`<div class="rows"><div><dt>近 7 天消耗</dt><dd>${money2(a.spend.cost)}</dd></div>
    <div><dt>请求 / token</dt><dd>${num(a.spend.calls)} / ${tok(a.spend.total)}</dd></div></div>`:'';
  const err=a.error?`<div class="basis warn">额度读取失败:${esc(a.error)}</div>`:'';
  return `<a class="card acct" data-provider="${esc(a.provider)}" href="#acct=${encodeURIComponent(a.id)}">
    <div class="acct-head">
      <div class="glyph">${esc((a.provider_label||a.provider||'?').slice(0,2).toUpperCase())}</div>
      <div class="acct-title"><h3>${esc(a.provider_label||a.provider)}</h3><span class="acct-id">${esc(a.account||'—')}</span></div>
      <span class="tag" data-tone="${tag.tone}">${esc(tag.text)}</span>
    </div>
    ${wins}${metered}${err}
  </a>`;
}

function cardTag(a){
  if(a.error)return{tone:'warn',text:'额度异常'};
  if(!a.windows||!a.windows.length)return{tone:'idle',text:a.kind==='metered'?'按量计费':'无额度'};
  const us=a.windows.map(w=>Number(w.used_percent)||0);
  const top=Math.max(...us);
  if(top>=99.5)return{tone:'bad',text:'额度打满'};
  if(top>=89)return{tone:'warn',text:'接近上限'};
  return{tone:'good',text:'额度正常'};
}

function detailHtml(a){
  const title=esc(a.provider_label||a.provider);
  let out=`<div class="sec-title">账号详情</div>
  <div class="card sec">
    <div class="dt-head" data-provider="${esc(a.provider)}">
      <div class="glyph">${esc((a.provider_label||a.provider||'?').slice(0,2).toUpperCase())}</div>
      <div style="min-width:0;flex:1"><h2>${title}</h2><span class="acct-id">${esc(a.account||'—')}</span></div>
      <span class="tag" data-tone="${cardTag(a).tone}">${esc(cardTag(a).text)}</span>
    </div>
    <div class="rows" style="margin-top:14px">
      <div><dt>计费类型</dt><dd>${a.kind==='metered'?'按量计费(无订阅额度)':'订阅额度窗口'}</dd></div>
      ${a.plan?`<div><dt>套餐 / 组织</dt><dd>${esc(a.plan)}</dd></div>`:''}
      ${a.account_scope?`<div><dt>账号作用域</dt><dd class="mono">${esc(a.account_scope)}</dd></div>`:''}
      <div><dt>数据口径</dt><dd style="max-width:60%">${esc(a.note||'')}</dd></div>
    </div>
    ${a.account_raw?`<div class="src" style="margin-top:12px">原始标识:${esc(a.account_raw)}</div>`:''}
  </div>`;

  (a.windows||[]).forEach(w=>{
    const us=w.usage||{},fc=w.forecast||{},cap=w.capacity||{};
    const okUs=us.calls?((us.calls-(us.failed||0))/us.calls*100):null;
    out+=`<div class="sec-title">${esc(w.label)}窗口 · 完整分析</div>
    <div class="card sec">
      <h4>${w.used_percent===null?'额度未知':(clamp(w.used_percent)>=99.5?'额度已打满':'剩余 '+pct(w.remaining_percent))}</h4>
      <p class="sec-sub">${esc(w.label)}窗口 · 起点 ${short(w.window_start_ms)} · 重置 ${short(w.reset_at_ms)}${w.left_str?'（还有 '+esc(w.left_str)+'）':''}</p>
      ${windowHtml(w,false)}
      <div class="rows" style="margin-top:14px">
        <div><dt>窗口内请求</dt><dd>${num(us.calls)} 次${us.failed?`（失败 ${num(us.failed)}，成功 ${okUs===null?'—':okUs.toFixed(1)+'%'}）`:'（成功率 100%）'}</dd></div>
        <div><dt>Token 合计</dt><dd>${tok(us.total)}</dd></div>
        <div><dt>未缓存输入 / 输出</dt><dd>${tok(us.in)} / ${tok(us.out)}</dd></div>
        <div><dt>缓存读 / 缓存写</dt><dd>${tok(us.cache_read)} / ${tok(us.cache_creation)}</dd></div>
        <div><dt>本窗口消耗</dt><dd>${money2(us.cost)}</dd></div>
        <div><dt>每 1% 额度 ≈</dt><dd>${w.per_percent_cost?money(w.per_percent_cost):'—'}</dd></div>
        <div><dt>推算剩余额度</dt><dd>${w.est_remaining_cost!==null&&w.est_remaining_cost!==undefined?money2(w.est_remaining_cost):'—'}</dd></div>
        <div><dt>额度来源</dt><dd class="mono">${esc(w.source||'—')}${w.observed_str?' · 观测 '+short(w.observed_at_ms):''}</dd></div>
      </div>
      ${w.unpriced&&w.unpriced.length?`<div class="basis warn">无官方单价的模型:${esc(w.unpriced.join(', '))}</div>`:''}
    </div>

    <div class="card sec">
      <h4 style="font-size:15px">额度预测</h4>
      <p class="sec-sub">按「已用百分点」把本窗口的实测值折算到整窗(与 CPAMP 凭证页的预测同口径)</p>
      ${fc.available?`<div class="fc">
        <div><div class="k">预计请求</div><div class="v">${num(fc.est_calls)}</div></div>
        <div><div class="k">预计 Token</div><div class="v">${tok(fc.est_tokens)}</div></div>
        <div><div class="k">预计花费</div><div class="v">${money2(fc.est_cost)}</div></div>
        <div><div class="k">成功率</div><div class="v">${fc.success_rate===null||fc.success_rate===undefined?'—':fc.success_rate+'%'}</div></div>
      </div>
      <div class="basis">依据:${fc.basis==='provider_percent'
        ?`本窗口已用 ${pct(fc.used_percent_snapshot)}，折算系数 ×${fc.factor}`
        :`沿用上个满窗窗口(起点 ${esc(short(fc.source_window_start_ms))})的实测值`}</div>`:
      `<div class="basis">暂不可预测:本窗口还没有额度百分比或用量样本</div>`}
    </div>

    <div class="card sec">
      <h4 style="font-size:15px">容量反推</h4>
      <p class="sec-sub">用历史采样把「100% 额度 ≈ 多少钱」推出来;样本越多越准</p>
      <div class="rows">
        <div><dt>整窗容量(预计总金额)</dt><dd>${money2(w.est_total_cost)}</dd></div>
        <div><dt>反推依据</dt><dd>${w.est_basis==='history'?'历史采样过原点回归':(w.est_basis==='this_window'?'本窗口已花 ÷ 已用百分点':'不足')}</dd></div>
        <div><dt>回归样本</dt><dd>${cap.samples?`${cap.samples} 段 / ${cap.windows} 个窗口 · 离散 ±${cap.spread_pct}%`:'暂无(单窗口折算)'}</dd></div>
        ${cap.per_percent?`<div><dt>回归斜率</dt><dd>${money(cap.per_percent)} / 个百分点</dd></div>`:''}
        <div><dt>满窗实测记录</dt><dd>${(w.full_windows&&w.full_windows.length)?w.full_windows.map(f=>`${short(f.window_start_ms)} → ${money2(f.cost)}`).join('<br>'):'暂无'}</dd></div>
      </div>
    </div>

    <div class="card sec">
      <h4 style="font-size:15px">模型构成</h4>
      <p class="sec-sub">本窗口按模型拆分的费用与 token</p>
      ${(w.models&&w.models.length)?`<div class="models">${w.models.map(m=>`<div>
        <span class="m-name">${esc(m.model||'未知')}</span>
        <span class="m-tok">${num(m.calls)} 次 · ${tok(m.total)} · 出 ${tok(m.out)}</span>
        <span class="m-cost">${money(m.cost)}${m.priced?'':' ?'}</span></div>`).join('')}</div>`
      :'<div class="basis">本窗口暂无请求</div>'}
    </div>`;
  });

  if(a.spend){
    out+=`<div class="sec-title">消耗</div><div class="card sec">
      <h4 style="font-size:15px">近 7 天</h4>
      <div class="rows">
        <div><dt>金额</dt><dd>${money2(a.spend.cost)}</dd></div>
        <div><dt>请求 / token</dt><dd>${num(a.spend.calls)} / ${tok(a.spend.total)}</dd></div>
      </div>
      ${(a.spend_models&&a.spend_models.length)?`<div class="models">${a.spend_models.map(m=>`<div>
        <span class="m-name">${esc(m.model||'未知')}</span>
        <span class="m-tok">${num(m.calls)} 次 · ${tok(m.total)}</span>
        <span class="m-cost">${money(m.cost)}</span></div>`).join('')}</div>`:''}
    </div>`;
  }

  if(a.extra_usage){
    const e=a.extra_usage;
    out+=`<div class="sec-title">额外用量包</div><div class="card sec"><div class="rows">
      <div><dt>是否启用</dt><dd>${e.is_enabled?'已启用':'未启用'+(e.disabled_reason?`（${esc(e.disabled_reason)}）`:'')}</dd></div>
      ${e.used_credits?`<div><dt>额度</dt><dd>${money2(e.used_credits)} ${esc(e.currency||'')}</dd></div>`:''}
    </div></div>`;
  }
  if(a.limits&&a.limits.length){
    out+=`<div class="sec-title">上游额度标记</div><div class="card sec"><div class="rows">
      ${a.limits.map(l=>`<div><dt>${esc(l.kind)}</dt><dd>${pct(l.percent)} · ${esc(l.severity||'')}${l.resets_at?' · '+esc(short(Date.parse(l.resets_at))):''}</dd></div>`).join('')}
    </div></div>`;
  }
  return out;
}

function renderList(){
  const list=(DATA.accounts||[]);
  $('summary').textContent=`共 ${list.length} 个账号 · 更新于 ${stamp(DATA.generated_ms)}`;
  $('accounts').innerHTML=list.map(cardHtml).join('')||'<div class="basis">没有账号</div>';
  const top=list.flatMap(a=>a.windows||[]).map(w=>Number(w.used_percent)||0);
  $('srcpill').className='pill plain';
  $('srcpill').textContent=top.some(v=>v>=99.5)?'有窗口已打满':'额度读取正常';
  if(top.some(v=>v>=99.5)){$('srcpill').className='pill warn';}
}

async function load(force){
  try{
    DATA=await api('/accounts'+(force?'?force=1':''));
    if(current){
      const a=(DATA.accounts||[]).find(x=>x.id===current);
      if(a){$('detail').innerHTML=detailHtml(a);return}
      current=null;history.replaceState(null,'','#');
    }
    $('detail').innerHTML='';$('accounts').classList.remove('hidden');
    $('back').classList.add('hidden');$('title').textContent='额度与用量';
    renderList();
    $('stamp').textContent='更新于 '+stamp(DATA.generated_ms);
    $('stamp').className='pill';
    setNote('');
  }catch(e){
    $('stamp').className='pill warn';
    if(e.message==='AUTH'){
      $('stamp').textContent='需要登录态';
      setNote('未读到有效的面板登录态,请在上方连接或重新登录 CPAMP 面板。','warn');
      $('manual').classList.remove('hidden');$('manualToggle').classList.add('hidden');$('reconnect').classList.remove('hidden');
    }else{
      $('stamp').textContent='读取失败';
      setNote('读取失败:'+esc(e.message),'warn');
    }
  }
}

async function openDetail(id){
  current=id;$('accounts').classList.add('hidden');$('back').classList.remove('hidden');
  $('title').textContent='账号详情';$('detail').innerHTML='<div class="skeleton"></div>';
  const d=await api('/accounts/'+encodeURIComponent(id)+'?force=1').catch(async()=>{ // 先强刷一次再回落
    return await api('/accounts/'+encodeURIComponent(id));
  });
  $('detail').innerHTML=detailHtml(d.account);
  $('stamp').textContent='更新于 '+stamp(d.generated_ms);
}

function route(){
  const m=(location.hash||'').match(/^#acct=(.+)$/);
  const id=m?decodeURIComponent(m[1]):null;
  if(!id){
    current=null;$('accounts').classList.remove('hidden');$('detail').innerHTML='';
    $('back').classList.add('hidden');$('title').textContent='额度与用量';
    if(DATA)renderList();
    return;
  }
  openDetail(id);
}

function boot(){
  KEY=panelKey()||localStorage.getItem('cpa-usage-key')||'';
  if(!KEY){
    setNote('正在等待面板登录态…如未自动读到,请在上方手动连接。','');
    $('manual').classList.remove('hidden');$('manualToggle').classList.remove('hidden');$('reconnect').classList.remove('hidden');
  }else{
    $('manual').classList.add('hidden');$('manualToggle').classList.add('hidden');$('reconnect').classList.remove('hidden');
  }
  route();load();
  if(TIMER)clearInterval(TIMER);
  TIMER=setInterval(()=>{if(KEY)route();},60000);
}

$('refresh').onclick=()=>load(true);
$('back').onclick=()=>{location.hash=''};
$('manualToggle').onclick=()=>$('manual').classList.toggle('hidden');
$('reconnect').onclick=boot;
$('connect').onclick=()=>{const v=$('key').value.trim();if(!v)return;KEY=v;localStorage.setItem('cpa-usage-key',v);$('key').value='';$('manual').classList.add('hidden');load()};
$('key').addEventListener('keydown',e=>{if(e.key==='Enter')$('connect').click()});
addEventListener('hashchange',route);
addEventListener('storage',e=>{if(e.key==='cli-proxy-auth')boot()});
boot();
</script></html>
